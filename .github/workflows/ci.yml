name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run build
            - run: test -z "$(git status --porcelain)"
            - name: Server tests with coverage (unit and integration)
              run: npm exec -w src/axon -- vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary
            - name: Frontend tests with coverage
              run: npm run test -w src/axon.Frontend -- --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary
            - name: Coverage report
              if: always()
              continue-on-error: true
              uses: actions/github-script@v7
              env:
                  COVERAGE_FILES: |
                      Server=src/axon/coverage/coverage-summary.json
                      Frontend=src/axon.Frontend/coverage/coverage-summary.json
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- coverage-report -->';
                      const rows = process.env.COVERAGE_FILES.trim().split('\n').map((line) => {
                        const [name, file] = line.trim().split('=');
                        if (!fs.existsSync(file)) return `| ${name} | n/a | n/a | n/a | n/a |`;
                        const t = JSON.parse(fs.readFileSync(file, 'utf8')).total;
                        return `| ${name} | ${t.statements.pct}% | ${t.branches.pct}% | ${t.functions.pct}% | ${t.lines.pct}% |`;
                      });
                      const body = [marker, '## Test coverage', '', '| Package | Statements | Branches | Functions | Lines |', '|---|---|---|---|---|', ...rows, '', 'Report only: no minimum is enforced.'].join('\n');
                      await core.summary.addRaw(body).write();
                      if (context.eventName !== 'pull_request') return;
                      const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
                      const existing = comments.find((c) => c.body.includes(marker));
                      if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
                      else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });            - run: npm run test:dev-smoke
            - run: npx playwright install --with-deps chromium
              working-directory: src/axon.E2ETests
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-artifacts
                  path: |
                      src/axon.E2ETests/playwright-report/
                      src/axon.E2ETests/test-results/
                  if-no-files-found: ignore
